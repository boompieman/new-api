name: Deploy release to Cloud Run

on:
  workflow_run:
    workflows:
      - Publish release image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-release-production
  # Serialize deployments so the newest queued release is always applied last.
  cancel-in-progress: false

jobs:
  changes:
    name: Detect backend deployment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Check out release source
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'workflow_dispatch'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          backend=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$SOURCE_EVENT_NAME" = "workflow_dispatch" ]; then
            backend=true
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            backend=true
          else
            while IFS= read -r path; do
              case "$path" in
                web/*|.github/workflows/cloudflare-pages.yml|docs/*|*.md)
                  ;;
                *)
                  backend=true
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Cloud Run deployment required: $backend" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'aimpowered' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'aimpowered-newapi' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'cloud-run-images' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Check deployment configuration
        id: config
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloud Run deployment skipped because the production environment is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Resolve production image
        if: steps.config.outputs.enabled == 'true'
        id: image
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          repository="${registry}/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${GCP_CLOUD_RUN_SERVICE}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="github-${{ github.event.workflow_run.id }}"
          else
            tag="release"
          fi
          digest="$(gcloud artifacts docker images describe "${repository}:${tag}" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          echo "image=${repository}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision
        if: steps.config.outputs.enabled == 'true'
        run: |
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --image="${{ steps.image.outputs.image }}" \
            --quiet

      - name: Deployment summary
        if: steps.config.outputs.enabled == 'true'
        run: |
          service_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          echo "### Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`$GCP_CLOUD_RUN_SERVICE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.image.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $service_url" >> "$GITHUB_STEP_SUMMARY"
