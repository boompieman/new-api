name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches:
      - release
    paths:
      - 'web/**'
      - 'VERSION'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare Pages requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: |
          if bun -e "const pkg = await Bun.file('package.json').json(); process.exit(pkg.scripts?.test ? 0 : 1)"; then
            node ./node_modules/vitest/vitest.mjs run
          else
            echo "No frontend test script is defined for this upstream snapshot; skipping."
          fi

      - name: Build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: bun run build

      - name: Deploy production to Cloudflare Pages
        run: >-
          bunx wrangler@4.124.0 pages deploy dist
          --project-name=omniai-web
          --branch=release
          --commit-hash=${{ github.sha }}
