name: Publish release image

on:
  workflow_run:
    workflows:
      - Release CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to publish
        required: true
        default: release
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-release-image
  # A later frontend-only release must not cancel an in-flight backend image.
  cancel-in-progress: false

jobs:
  changes:
    name: Detect backend changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'release')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          backend=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            backend=true
          else
            while IFS= read -r path; do
              case "$path" in
                web/*|.github/workflows/cloudflare-pages.yml|docs/*|*.md)
                  ;;
                *)
                  backend=true
                  ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Backend image required: $backend" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish production image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'aimpowered' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'aimpowered-newapi' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'cloud-run-images' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Check deployment configuration
        id: config
        run: |
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || [ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Production image publishing skipped because the production environment is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve source revision
        if: steps.config.outputs.enabled == 'true'
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Log in to Artifact Registry
        if: steps.config.outputs.enabled == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        if: steps.config.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image metadata
        if: steps.config.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_CLOUD_RUN_SERVICE }}
          tags: |
            type=raw,value=release
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=raw,value=github-${{ github.run_id }}

      - name: Build and publish image
        if: steps.config.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true

      - name: Publish summary
        if: steps.config.outputs.enabled == 'true'
        run: |
          echo "### Published production image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${GCP_CLOUD_RUN_SERVICE}:github-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
